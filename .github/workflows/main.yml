name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install project tools
        run: |
          mise install

      - name: Install Tuist dependencies
        run: |
          mise exec -- tuist install

      - name: Generate Xcode workspace
        run: |
          mise exec -- tuist generate --no-open

      - name: Build iOS app without signing
        run: |
          xcodebuild \
            -workspace SDM.xcworkspace \
            -scheme SDMApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find app
        run: |
          echo "Generated applications:"
          find build -type d -name "*.app"

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app file not found!"
            exit 1
          fi

          echo "Using app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r SwiftyDownloadManager-Unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftyDownloadManager-Unsigned
          path: SwiftyDownloadManager-Unsigned.ipa
